# Separate R3 target; retain Week 3 USB CDC fixes and 4096-byte main stack.
CONFIG_APP_WEEK4_HEAD=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_INIT_STACKS=y
CONFIG_FPU=y
# Nordic USB DFU application: after MBR, before onboard bootloader at 0xe0000.
# The board's MCUboot slots are inactive (USE_DT_CODE_PARTITION=n).
CONFIG_FLASH_LOAD_SIZE=0xdf000
