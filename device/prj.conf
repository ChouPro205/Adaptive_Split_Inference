CONFIG_GPIO=y

# USB CDC ACM console using the NCS v3.4.0/Zephyr 4.4 next-generation stack.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Adaptive Split Inference SV1"

# The benchmark prints uint64_t fixed-point statistics.
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_CORTEX_M_DWT=y
CONFIG_MAIN_STACK_SIZE=4096

# Keep the demo output deterministic and free from unrelated logs.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
