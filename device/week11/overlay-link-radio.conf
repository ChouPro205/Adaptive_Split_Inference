# Week 11 additions to the week 7 radio set (../week7/overlay-radio.conf, unchanged; build_week11.ps1 passes
# both). W11-D3 needs the dongle to drive the link state itself:
#   LE Coded PHY (off in weeks 6-10), dynamic TX power (Zephyr VS Write TX Power Level, handled by the SDC
#   only with this option), connection RSSI (HCI Read RSSI, link-usb STATUS / RSSI).
# The automatic peripheral parameter request 5 s after connecting is off, so only the plan's STATE asks for
# parameters (week 10 had it on; its request came before CONNPARAM and was superseded).
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
