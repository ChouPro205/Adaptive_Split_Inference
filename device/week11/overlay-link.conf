# link: the image of every week 12 PPK2 link-state session (W11-D3). No USB stack, console, printk or log (same set as
# week 7/8 energy); LEDs are driven off by main.c. The radio set is ../week7/overlay-radio.conf
# + overlay-link-radio.conf (build_week11.ps1 passes all three); no NVS code is linked.
CONFIG_WEEK11_LINK=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_LINE_CTRL=n
CONFIG_PRINTK=n
