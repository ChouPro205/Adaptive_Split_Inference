# dev: the image of every E_dev PPK2 session (W9-D1, TC4). No radio, no NVS, no USB stack,
# console, printk or log (same set as week 7 energy and the week 2 Idle image); LEDs are driven
# off by main.c.
CONFIG_WEEK9_DEV=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_LINE_CTRL=n
CONFIG_PRINTK=n
