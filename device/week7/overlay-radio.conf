# BLE peripheral and NVS nonce store, identical to week6/prj.conf (I1 BLE binding v1 §2-§4,
# nonce §2). Shared by energy-usb and energy.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ASI-SV1"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PRIVACY=n
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_ATT_TX_COUNT=6
