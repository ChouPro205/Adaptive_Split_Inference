# Common to the three week 7 variants; overlay-<variant>.conf selects the variant and its
# USB/radio configuration (build_week7.ps1 passes it as EXTRA_CONF_FILE).
CONFIG_GPIO=y
CONFIG_FPU=y
CONFIG_CORTEX_M_DWT=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=8192

# Application image must end before storage_partition at 0xDC000 (nonce §2), as in week 6:
# 0x1000 (after Nordic MBR) + 0xDB000 = 0xDC000, so the linker fails on overflow.
CONFIG_FLASH_LOAD_SIZE=0xdb000
