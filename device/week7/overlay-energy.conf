# energy: the image used in every PPK2 session (TC5). No USB stack, console, printk or log
# (same set as the week 2 Idle image, overlay-idle.conf); LEDs are driven off by main.c.
CONFIG_WEEK7_ENERGY=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_LINE_CTRL=n
CONFIG_PRINTK=n
