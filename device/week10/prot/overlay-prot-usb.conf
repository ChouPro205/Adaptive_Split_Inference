# prot-usb: USB CDC console, radio off, NVS nonce (same USB set as week 9 dev-usb). Powered from the
# laptop USB; its timings are debug evidence only, never energy numbers (TC2).
CONFIG_WEEK10_PROT_USB=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Adaptive Split Inference SV1"
CONFIG_CBPRINTF_FULL_INTEGRAL=y
