# prot: the image of every E_prot PPK2 session (W10-D1, TC1, TC4). No radio, no USB stack, console,
# printk or log (same set as week 9 dev); LEDs are driven off by main.c. NVS: overlay-nvs.conf.
CONFIG_WEEK10_PROT=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_LINE_CTRL=n
CONFIG_PRINTK=n
