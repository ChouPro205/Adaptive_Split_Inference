# ble-usb: the W10-D4 cycle with USB CDC debug output (same USB set as week 7 energy-usb). Powered from
# the laptop USB; its timings are debug evidence only, never energy numbers (TC2). The radio set is
# ../week7/overlay-radio.conf (build_week10.ps1 passes both).
CONFIG_WEEK10_BLE_USB=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Adaptive Split Inference SV1"
CONFIG_CBPRINTF_FULL_INTEGRAL=y
