# USB CDC console: control/debug only, never counted as radio evidence (binding §1).
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Adaptive Split Inference SV1"
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_CORTEX_M_DWT=y
CONFIG_FPU=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
# protect() path needs ~1.4 KB (A2); headroom for printk and the self tests.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Application image must end before storage_partition at 0xDC000 (nonce §2):
# 0x1000 (after Nordic MBR) + 0xDB000 = 0xDC000, so the linker itself fails on overflow.
CONFIG_FLASH_LOAD_SIZE=0xdb000

# Nonce state on storage_partition with Zephyr NVS (nonce §2). Never auto-format.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=n

# BLE peripheral per I1 BLE binding v1 §2.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ASI-SV1"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PRIVACY=n
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Negotiated-MTU profile: ATT MTU = min(BT_BUF_ACL_RX_SIZE - 4, BT_L2CAP_TX_MTU) = 247,
# i.e. 236 B of I1 frame per fragment (binding §3). overlay-mtu23.conf forces 23.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# BT_CTLR_DATA_LENGTH_MAX defaults to BT_BUF_ACL_RX_SIZE (251 here).

# Binding §4.3 uses TX_CREDITS = 4, which must not exceed the controller TX buffers;
# two more ATT buffers keep write responses possible while 4 notifications are queued.
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_ATT_TX_COUNT=6
